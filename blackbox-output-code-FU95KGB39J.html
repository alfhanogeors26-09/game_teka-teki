<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teka-Teki 100 Level - Game Lengkap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f8fafc;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        #level-value { color: #a855f7; }
        #score-value { color: #fbbf24; }
        #lives-value { color: #ef4444; }

        .difficulty-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .diff-easy { background: #22c55e; color: #000; }
        .diff-medium { background: #f59e0b; color: #000; }
        .diff-hard { background: #ef4444; color: #fff; }
        .diff-expert { background: #a855f7; color: #fff; }
        .diff-master { background: linear-gradient(90deg, #ec4899, #f59e0b); color: #fff; }

        .question-box {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px solid var(--primary);
        }

        #question {
            font-size: 1.2rem;
            text-align: center;
            line-height: 1.6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint-box {
            background: rgba(245, 158, 11, 0.15);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .hint-box.show { display: block; animation: fadeIn 0.3s; }

        .hint-box p {
            color: #fbbf24;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #answer {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 3px solid var(--primary);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        #answer:focus {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        #submit-btn {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        #submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.5);
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .message.correct {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            animation: bounce 0.5s;
        }

        .message.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            animation: shake 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons button {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .buttons button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .correct-answer {
            background: rgba(34, 197, 94, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .correct-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
            transition: width 0.5s;
        }

        .game-over, .game-win {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .game-over.show, .game-win.show { display: block; }

        .game-over h2, .game-win h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .win-screen h2 { color: #fbbf24; }
        .lose-screen h2 { color: #ef4444; }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            color: #a855f7;
            margin: 20px 0;
        }

        .options-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .options-modal.show { display: flex; }

        .options-box {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
        }

        .options-box h3 {
            margin-bottom: 20px;
            text-align: center;
        }

        .option-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            background: rgba(99, 102, 241, 0.2);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: var(--primary);
        }

        @media (max-width: 500px) {
            .game-container { padding: 20px; }
            .header h1 { font-size: 1.5rem; }
            .stats { flex-wrap: wrap; gap: 15px; }
            .answer-input { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- SCREEN: GAME PLAY -->
        <div id="game-screen">
            <div class="header">
                <h1>🎮 Teka-Teki 100 Level</h1>
                <div class="difficulty-badge diff-easy" id="difficulty-badge">MUDAH</div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 1%;"></div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="label">Level</div>
                    <div class="value" id="level-value">1</div>
                </div>
                <div class="stat-item">
                    <div class="label">Skor</div>
                    <div class="value" id="score-value">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">Nyawa</div>
                    <div class="value" id="lives-value">❤️❤️❤️</div>
                </div>
            </div>

            <div class="question-box">
                <p id="question">Memuat soal...</p>
            </div>

            <div class="hint-box" id="hint-box">
                <p>💡 <span id="hint">Hint akan muncul di sini</span></p>
            </div>

            <div class="answer-input">
                <input type="text" id="answer" placeholder="Ketik jawabanmu..." autocomplete="off">
                <button id="submit-btn" onclick="checkAnswer()">Kirim</button>
            </div>

            <div class="message" id="message"></div>

            <div class="correct-answer" id="correct-answer">
                <p>✅ Jawaban yang benar: <strong id="real-answer"></strong></p>
            </div>

            <div class="buttons">
                <button onclick="showHint()">💡 Hint (-10)</button>
                <button onclick="skipQuestion()">⏭️ Lewati (-15)</button>
                <button onclick="showOptions()">🎯 50:50 (-20)</button>
                <button onclick="restartGame()">🔄 Reset</button>
            </div>
        </div>

        <!-- SCREEN: GAME OVER -->
        <div class="game-over lose-screen" id="game-over-screen">
            <h2>💀 Game Over!</h2>
            <p>Kamu tidak punya nyawa lagi.</p>
            <div class="final-score" id="final-score-lose">0</div>
            <p>Level yang dicapai: <span id="max-level-lose">1</span></p>
            <br>
            <button class="option-btn" onclick="restartGame()">🔄 Main Lagi</button>
        </div>

        <!-- SCREEN: WIN -->
        <div class="game-over win-screen" id="win-screen">
            <h2>🏆 Selamat!</h2>
            <p>Kamu sudah menyelesaikan SEMUA 100 level!</p>
            <div class="final-score" id="final-score-win">0</div>
            <button class="option-btn" onclick="restartGame()">🔄 Main Lagi</button>
        </div>

        <!-- MODAL: 50:50 OPTIONS -->
        <div class="options-modal" id="options-modal">
            <div class="options-box">
                <h3>Pilih Opsi 🎯</h3>
                <div id="options-container"></div>
                <button class="option-btn" onclick="closeOptions()" style="margin-top: 15px; background: #ef4444;">Tutup</button>
            </div>
        </div>
    </div>
